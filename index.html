<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2D War Royale</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>

    <div id="hud" class="hidden">
      <div id="health-bar-wrap">
        <div id="health-bar-fill"></div>
        <span id="health-text">100</span>
      </div>
      <div id="ammo-text">-- / --</div>
      <div id="alive-text">생존자: -- </div>
      <div id="zone-text">안전지대 축소까지: --</div>
      <canvas id="minimap" width="160" height="160"></canvas>

      <div id="inventory-bar">
        <div class="inv-slot" data-slot="1">
          <span class="inv-key">1</span>
          <span class="inv-label">주먹</span>
        </div>
        <div class="inv-slot" data-slot="2">
          <span class="inv-key">2</span>
          <span class="inv-label">권총</span>
        </div>
        <div class="inv-slot" data-slot="3">
          <span class="inv-key">3</span>
          <span class="inv-label">소총</span>
        </div>
        <div class="inv-slot" data-slot="4">
          <span class="inv-key">4</span>
          <span class="inv-label">샷건</span>
        </div>
        <div class="inv-slot" data-slot="5">
          <span class="inv-key">5</span>
          <span class="inv-label">의료품</span>
          <span class="inv-count" id="medkit-count">0</span>
        </div>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <h1>2D 배틀그라운드</h1>
      <p>WASD 이동 · 마우스 조준/좌클릭 공격 · R 재장전 · 1~4 무기 전환 · 5 의료품 사용</p>
      <button id="start-btn">게임 시작</button>
    </div>

    <div id="drop-screen" class="overlay hidden">
      <h1>낙하 지점 선택</h1>
      <p>지도를 클릭해 낙하할 위치를 선택하세요</p>
      <canvas id="drop-canvas" width="560" height="560"></canvas>
      <button id="drop-confirm-btn" disabled>낙하 시작</button>
    </div>

    <div id="end-screen" class="overlay hidden">
      <h1 id="end-title">게임 종료</h1>
      <button id="restart-btn">다시 시작</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
